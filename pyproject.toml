[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-forecast"
version = "0.1.0"
description = "Global Extreme Climate & Heatwave Forecaster using NOAA GHCN-Daily and Deep Spatiotemporal Neural Networks"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Climate AI Research", email = "climate-forecast@example.com" }
]
keywords = ["climate", "forecasting", "heatwave", "extreme-weather", "time-series", "deep-learning", "pytorch", "huggingface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "safetensors>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
climate-forecast = "climate_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
